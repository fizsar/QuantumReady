name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      # Incluye los tests de la Fase 3: usan sockets reales pero con perfiles de
      # pocos milisegundos y 2-3 repeticiones (unos segundos). El benchmark
      # completo (100 repeticiones, hasta 600 ms por tramo) no se ejecuta aquí.
      - name: Ejecutar tests
        run: python -m pytest -v
